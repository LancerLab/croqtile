# Package testing
package_test:
  stage: pre-release-tests
  needs:
    - detect_changes
  rules:
    - if: $NO_PACK == "true"
      when: never
    - if: >
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^oss\//
      when: never
    - if: >
        $CI_COMMIT_BRANCH == "main" ||
        $CI_COMMIT_BRANCH =~ /^release\// ||
        $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
  script:
    - |
      if [ "${NON_CODE:-false}" == "true" ]; then
        echo "No code changes detected; skipping heavy tests."
        exit 0
      fi
    - echo "Running release tests..."
    - make package
    - echo "Checking for generated packages..."
    - echo $(pwd)
    - ls build-release/package/*.deb
    - ls build-release/package/*.zip
    - ls build-release/package/*.tar.gz
    - echo "Package check passed!"
    - echo "Installing .deb package..."
    - sudo dpkg --force-depends -i build-release/package/_CPack_Packages/Linux/DEB/*.deb
    - choreo --help && echo "Choreo Pkg-Run Test Passed" || (echo "Choreo Pkg-Run Test Failed" && exit 1)
    - echo "Verifying installation..."
    - if [ -f /usr/local/bin/choreo ]; then echo "choreo found in /usr/local/bin"; fi
    - if [ -f /usr/bin/choreo ]; then echo "choreo found in /usr/bin"; fi
    - echo "Testing dpkg removal..."
    - sudo dpkg -r choreo-executables
    - sudo dpkg -r choreo-rt_headers
    - echo "dpkg -r completed!"
  tags:
    - PKG
  timeout: 10m
  after_script:
    - 'echo "Cleaning up CI project directory: $CI_PROJECT_DIR ..."'
    - 'if [ -n "$CI_PROJECT_DIR" ] && [ "$CI_PROJECT_DIR" != "/" ]; then rm -rf $CI_PROJECT_DIR/{*,.[!.]*,..?*}; else echo "CI_PROJECT_DIR is not set or is root, skip cleanup!"; fi'
    - 'echo "Cleanup done."'

# Documentation generation stage
generate_docs:
  stage: docgen
  tags:
    - DOC
  rules:
    - if: $NO_PACK == "true"
      when: never
    - if: >
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^oss\//
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^oss\//
      when: never
    - changes:
        - Documents/**/*
        - mkdocs.yml
      when: on_success
    - when: never
  script:
    - echo "Setting up environment for documentation generation ..."
    - python3.8 -m pip install mkdocs mkdocs-material mkdocs-markdownextradata-plugin
    - make serve-doc
  timeout: 10m

# OSS keyword/path validation for oss/* branches and MRs targeting them.
# Runs oss-scan.sh to ensure no sensitive keywords leak into the public tree.
# When the CI config is sourced from main but the checkout is oss/*, the scan
# script may not exist in the checked-out tree.  Fall back to main's copy.
oss_scan:
  stage: oss-validation
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^oss\//
      when: on_success
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^oss\//
      when: on_success
  script:
    - echo "Running OSS keyword and path scan on branch $CI_COMMIT_BRANCH..."
    - |
      if [ ! -f scripts/oss/oss-scan.sh ]; then
        echo "oss-scan.sh not found in working tree; fetching from main..."
        git fetch origin main --depth=1
        mkdir -p scripts/oss
        git show origin/main:scripts/oss/oss-scan.sh > scripts/oss/oss-scan.sh
        git show origin/main:scripts/oss/os_kw.txt  > scripts/oss/os_kw.txt 2>/dev/null || true
        chmod +x scripts/oss/oss-scan.sh
      fi
    - bash scripts/oss/oss-scan.sh --tree HEAD -k scripts/oss/os_kw.txt -v
  tags:
    - GPU
  allow_failure: false
  timeout: 5m

