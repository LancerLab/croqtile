# Docker environment GCU3 testing
gcu3_docker_test:
  stage: pre-release-tests
  script:
    - echo "Running tests with GCU3 S60 EFDOCKER..."
    - source /home/.devtools/tools/env.sh
    - docker start choreo_ci
    - |
      docker exec -u 0 choreo_ci bash -c "
      TIMESTAMP=$(date +%Y%m%d_%H%M%S) && \
      WORKDIR=/tmp/choreo_docker_test_\$TIMESTAMP && \
      mkdir -p \$WORKDIR && \
      cd \$WORKDIR && \
      if [ -d choreo ]; then
        cd choreo && git reset --hard && git pull;
      else
        git clone git@git.enflame.cn:xiaofeng.guan/choreo.git && cd choreo;
      fi && \
      make setup-core && \
      make test && \
      make package && \
      make -C tools install-gcu3-topscc FTP_SERVER=172.16.11.18 && \
      dpkg -i package/*.deb && \
      choreo tests/smoke_test.co -es && echo 'Choreo Pkg-Run Test Passed' || (echo 'Choreo Pkg-Run Test Failed' && dpkg -r choreo && exit 1) && \
      dpkg -r choreo && \
      rm -rf \$WORKDIR"
  tags:
    - GCU3
  only:
    - main
    - release/alpha
    - merge_requests
  allow_failure: true
  timeout: 15m
  after_script:
    - 'echo "Cleaning up CI project directory: $CI_PROJECT_DIR ..."'
    - 'if [ -n "$CI_PROJECT_DIR" ] && [ "$CI_PROJECT_DIR" != "/" ]; then rm -rf $CI_PROJECT_DIR/{*,.[!.]*,..?*}; else echo "CI_PROJECT_DIR is not set or is root, skip cleanup!"; fi'
    - 'echo "Cleanup done."'

# Package testing
package_test:
  stage: pre-release-tests
  script:
    - echo "Running release tests..."
    - make setup-core
    - make package
    - echo "Checking for generated packages..."
    - echo $(pwd)
    - ls package/*.deb
    - ls package/*.zip
    - ls package/*.tar.gz
    - echo "Package check passed!"
    - echo "Installing .deb package..."
    - sudo dpkg --force-depends -i package/*.deb
    - choreo tests/smoke_test.co -es && echo "Choreo Pkg-Run Test Passed" || (echo "Choreo Pkg-Run Test Failed" && exit 1)
    - echo "Verifying installation..."
    - if [ -f /usr/local/bin/choreo ]; then echo "choreo found in /usr/local/bin"; fi
    - if [ -f /usr/bin/choreo ]; then echo "choreo found in /usr/bin"; fi
    - echo "Testing dpkg removal..."
    - sudo dpkg -r choreo
    - echo "dpkg -r completed!"
  tags:
    - PKG
  only:
    - main
    - release/alpha
    - merge_requests
  timeout: 10m
  after_script:
    - 'echo "Cleaning up CI project directory: $CI_PROJECT_DIR ..."'
    - 'if [ -n "$CI_PROJECT_DIR" ] && [ "$CI_PROJECT_DIR" != "/" ]; then rm -rf $CI_PROJECT_DIR/{*,.[!.]*,..?*}; else echo "CI_PROJECT_DIR is not set or is root, skip cleanup!"; fi'
    - 'echo "Cleanup done."'

# Documentation generation stage
generate_docs:
  stage: docgen
  tags:
    - DOC
  script:
    - echo "Setting up environment for documentation generation ..."
    - python3.8 -m pip install mkdocs mkdocs-material mkdocs-markdownextradata-plugin
    - make serve-doc
  timeout: 10m

