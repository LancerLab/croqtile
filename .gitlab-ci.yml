stages:
  - check-in-tests
  - pre-release-tests
  - docgen
  - oss-validation

# TODO: make package release work
#  - artifacts
# GPU Testing
gpu_test:
  variables:
   GIT_SUBMODULE_STRATEGY: recursive
   GIT_SSH_COMMAND: 'ssh -F /opt/gitlab-runner/ssh/config'
  stage: check-in-tests
  rules:
    - if: $NO_GPU == "true"
      when: never
    - if: >
        $CI_COMMIT_BRANCH == "main" || 
        $CI_COMMIT_BRANCH == "cute" || 
        $CI_COMMIT_BRANCH =~ /^release\// ||
        $CI_COMMIT_BRANCH =~ /^oss\// ||
        $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
  script:
    - echo "Running tests with GPU..."
    - make setup-core
    - make build
    - make ci-test
  artifacts:
    paths:
      - choreo
      - copp
      - tools/bin
      - tools/lib
      - tools/include
      - tools/factor_backend
      - tools/shared
  tags:
    - GPU
  timeout: 22m
  after_script:
    - 'echo "Cleaning up CI project directory: $CI_PROJECT_DIR ..."'
    - 'if [ -n "$CI_PROJECT_DIR" ] && [ "$CI_PROJECT_DIR" != "/" ]; then rm -rf $CI_PROJECT_DIR/{*,.[!.]*,..?*}; else echo "CI_PROJECT_DIR is not set or is root, skip cleanup!"; fi'
    - 'echo "Cleanup done."'

