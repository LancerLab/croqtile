# 定义 CI/CD 流水线的阶段
stages:
  - check-in-tests


# Test 阶段：需要 GPU 支持的测试，运行 `make test` 来执行测试
gputest:
  stage: check-in-tests
  script:
    - echo "Running tests with GPU..."
    - make ci-gpu-test  # 假设 `make test` 用于运行测试
  tags:
    - GPU  # 在 GPU 机器上运行作业
  only:
    - main  # 仅在 `main` 分支上执行该作业
    - merge_requests

gcu2test:
  stage: check-in-tests
  script:
    - echo "Running tests with GCU2..."
    - make ci-gcu2-test # 假设 `make test` 用于运行测试
  tags:
    - GCU2  # 在 GPU 机器上运行作业
  only:
    - main  # 仅在 `main` 分支上执行该作业
    - merge_requests

gcu3test:
  stage: check-in-tests
  script:
    - echo "Running tests with GCU3 S60..."
    - make ci-gcu3-test # 假设 `make test` 用于运行测试
  tags:
    - GCU3  # 在 GPU 机器上运行作业
  only:
    - main  # 仅在 `main` 分支上执行该作业
    - merge_requests

cache:
  paths:
    - venv/  # 缓存虚拟环境
    - .cache/pip/  # 缓存 pip 下载的包
