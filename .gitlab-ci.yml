stages:
  - check-in-tests
  - pre-release-tests
  - docgen
  - cleanup

# TODO: make package release work
#  - artifacts
# GPU Testing
gpu_test:
  stage: check-in-tests
  script:
    - echo "Running tests with GPU..."
    - make setup-core
    - make build
    - make ci-test
  artifacts:
    paths:
      - choreo
      - copp
      - tools/bin
      - tools/lib
      - tools/include
      - tools/factor_backend
      - tools/shared
  tags:
    - GPU
  only:
    - main
    - release/alpha
    - merge_requests
  timeout: 10m

# GCU2 Testing
gcu2_test:
  stage: check-in-tests
  script:
    - echo "Running tests with GCU2..."
    - make setup-gcu2
    - make build
    - make ci-test
  artifacts:
    paths:
      - choreo
      - copp
      - tools/bin
      - tools/lib
      - tools/include
      - tools/factor_backend
      - tools/shared
  tags:
    - GPU
  only:
    - main
    - release/alpha
    - merge_requests
  allow_failure: true
  timeout: 10m

# GCU3 Testing
gcu3_test:
  stage: check-in-tests
  script:
    - echo "Running tests with GCU3 S60..."
    - make setup-gcu3
    - make build
    - make ci-test
  artifacts:
    paths:
      - choreo
      - copp
      - tools/bin
      - tools/lib
      - tools/include
      - tools/factor_backend
      - tools/shared
  tags:
    - GCU3
  only:
    - main
    - release/alpha
    - merge_requests
  allow_failure: true
  timeout: 10m

# Docker environment GCU3 testing
gcu3_docker_test:
  stage: pre-release-tests
  script:
    - echo "Running tests with GCU3 S60 EFDOCKER..."
    - source /home/.devtools/tools/env.sh
    - efdocker enter choreo_ci
    - make setup-core
    - make test
  tags:
    - GCU3
  only:
    - main
    - release/alpha
    - merge_requests
  allow_failure: true
  timeout: 10m

# Package testing
package_test:
  stage: pre-release-tests
  script:
    - echo "Running release tests..."
    - make setup-core
    - make package
    - echo "Checking for generated packages..."
    - echo $(pwd)
    - ls package/*.deb
    - ls package/*.zip
    - ls package/*.tar.gz
    - ls package/*.rpm
    - echo "Package check passed!"
    - echo "Installing .deb package..."
    - sudo dpkg -i package/*.deb
    - echo "Verifying installation..."
    - if [ -f /usr/local/bin/choreo ]; then echo "choreo found in /usr/local/bin"; fi
    - if [ -f /usr/bin/choreo ]; then echo "choreo found in /usr/bin"; fi
    - echo "Testing dpkg removal..."
    - sudo dpkg -r choreo
    - echo "dpkg -r completed!"
  artifacts:
    paths:
      - package/
  tags:
    - GPU
  only:
    - main
    - release/alpha
    - merge_requests
  timeout: 10m

# Documentation generation stage
generate_docs:
  stage: docgen
  tags:
    - DOC
  script:
    - echo "Setting up environment for documentation generation ..."
    - python3.8 -m pip install mkdocs mkdocs-material mkdocs-markdownextradata-plugin
    - make serve-doc
  timeout: 10m

