stages:
  - check-in-tests
  - pre-release-tests
  - docgen

# TODO: make package release work
#  - artifacts
# GPU Testing
gpu_test:
  variables:
   GIT_SUBMODULE_STRATEGY: recursive
   GIT_SSH_COMMAND: 'ssh -F /opt/gitlab-runner/ssh/config'
  stage: check-in-tests
  script:
    - echo "Running tests with GPU..."
    - make setup-core
    - make build
    - make ci-test
  artifacts:
    paths:
      - choreo
      - copp
      - tools/bin
      - tools/lib
      - tools/include
      - tools/factor_backend
      - tools/shared
  tags:
    - GPU
  only:
    - main
    - release/alpha
    - merge_requests
  timeout: 10m
  after_script:
    - 'echo "Cleaning up CI project directory: $CI_PROJECT_DIR ..."'
    - 'if [ -n "$CI_PROJECT_DIR" ] && [ "$CI_PROJECT_DIR" != "/" ]; then rm -rf $CI_PROJECT_DIR/{*,.[!.]*,..?*}; else echo "CI_PROJECT_DIR is not set or is root, skip cleanup!"; fi'
    - 'echo "Cleanup done."'

