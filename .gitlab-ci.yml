# Docker environment GCU3 testing
gcu3_docker_test:
  stage: pre-release-tests
  script:
    - echo "Running tests with GCU3 S60 EFDOCKER..."
    - source /home/.devtools/tools/env.sh
    - docker start choreo_ci
    - |
      docker exec choreo_ci bash -c "
      TIMESTAMP=$(date +%Y%m%d_%H%M%S) && \
      WORKDIR=/tmp/choreo_docker_test_\$TIMESTAMP && \
      mkdir -p \$WORKDIR && \
      cd \$WORKDIR && \
      if [ -d choreo ]; then
        cd choreo && git reset --hard && git pull;
      else
        git clone git@git.enflame.cn:xiaofeng.guan/choreo.git && cd choreo;
      fi && \
      make setup-core && \
      make test && \
      make package && \
      dpkg -i package/*.deb && \
      choreo samples/topscc/identity.co -es && echo 'Choreo Pkg-Run Test Passed' || (echo 'Choreo Pkg-Run Test Failed' && dpkg -r choreo && exit 1) && \
      dpkg -r choreo && \
      rm -rf \$WORKDIR"
  tags:
    - GCU3
  only:
    - main
    - release/alpha
    - merge_requests
  allow_failure: true
  timeout: 10m

# Package testing
package_test:
  stage: pre-release-tests
  script:
    - echo "Running release tests..."
    - make setup-core
    - make package
    - echo "Checking for generated packages..."
    - echo $(pwd)
    - ls package/*.deb
    - ls package/*.zip
    - ls package/*.tar.gz
    - echo "Package check passed!"
    - echo "Installing .deb package..."
    - sudo dpkg -i package/*.deb
    - choreo samples/topscc/identity.co -es && echo "Choreo Pkg-Run Test Passed" || (echo "Choreo Pkg-Run Test Failed" && exit 1)
    - echo "Verifying installation..."
    - if [ -f /usr/local/bin/choreo ]; then echo "choreo found in /usr/local/bin"; fi
    - if [ -f /usr/bin/choreo ]; then echo "choreo found in /usr/bin"; fi
    - echo "Testing dpkg removal..."
    - sudo dpkg -r choreo
    - echo "dpkg -r completed!"
  tags:
    - GPU
  only:
    - main
    - release/alpha
    - merge_requests
  timeout: 10m

# Documentation generation stage
generate_docs:
  stage: docgen
  tags:
    - DOC
  script:
    - echo "Setting up environment for documentation generation ..."
    - python3.8 -m pip install mkdocs mkdocs-material mkdocs-markdownextradata-plugin
    - make serve-doc
  timeout: 10m

# Cache configuration to speed up CI by reusing the environment
cache:
  paths:
    - venv/
    - .cache/pip/

