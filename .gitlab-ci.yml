stages:
  - check-in-tests
  - pre-release-tests
  - docgen
  - cleanup

# TODO: make package release work
#  - artifacts
# GPU Testing
gpu_test:
  stage: check-in-tests
  script:
    - echo "Running tests with GPU..."
    - make setup-core
    - make build
    - make ci-test
  artifacts:
    paths:
      - choreo
      - copp
      - tools/bin
      - tools/lib
      - tools/include
      - tools/factor_backend
      - tools/shared
  tags:
    - GPU
  only:
    - main
    - release/alpha
    - merge_requests
  timeout: 10m

