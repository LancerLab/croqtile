# co-lit
gcu_arch="none"
gcu_device_count=0
gcu_min_devices=0

SUPPORTED_GCU_TARGETS=("gcu210" "gcu300" "gcu400" "gcu500")

add_all_gcu_archs() {
  set_add REQ_TARGETS "${SUPPORTED_GCU_TARGETS[@]}"
}

expand_gcu_arch_range() {
  local minimum="$1"
  local arch
  for arch in "${SUPPORTED_GCU_TARGETS[@]}"; do
    if [[ "$arch" =~ ^gcu([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" -ge "$minimum" ]; then
      set_add REQ_TARGETS "$arch"
    fi
  done
}

add_gcu_arch() {
  gcu_min_devices=0
  local tgts="$@"
  for tgt in ${tgts}; do
    if [[ "${tgt}" =~ ^GCUx([0-9]+)$ ]]; then
      local count="${BASH_REMATCH[1]}"
      set_add REQ_TARGETS "${SUPPORTED_GCU_TARGETS[@]}"
      if (( count > gcu_min_devices )); then
        gcu_min_devices=$count
      fi
    elif [[ "${tgt}" =~ ^GCU([0-9]+)x([0-9]+)$ ]]; then
      local arch_num="${BASH_REMATCH[1]}"
      local count="${BASH_REMATCH[2]}"
      set_add REQ_TARGETS "gcu${arch_num}"
      if (( count > gcu_min_devices )); then
        gcu_min_devices=$count
      fi
    # GCU<arch>+x<count>: arch and above with at least <count> devices (e.g. GCU300+x2)
    elif [[ "${tgt}" =~ ^GCU([0-9]+)\+x([0-9]+)$ ]]; then
      local arch_num="${BASH_REMATCH[1]}"
      local count="${BASH_REMATCH[2]}"
      expand_gcu_arch_range "$arch_num"
      if (( count > gcu_min_devices )); then
        gcu_min_devices=$count
      fi
    # GCU<arch>+: arch and above (e.g. GCU300+ -> gcu300, gcu400, gcu500)
    elif [[ "${tgt}" =~ ^GCU([0-9]+)\+$ ]]; then
      expand_gcu_arch_range "${BASH_REMATCH[1]}"
    elif [[ "${tgt}" == "GCU" ]]; then
      add_all_gcu_archs
    elif [[ "${tgt}" == "GCU500" ]]; then set_add REQ_TARGETS "gcu500";
    elif [[ "${tgt}" == "GCU400" ]]; then set_add REQ_TARGETS "gcu400";
    elif [[ "${tgt}" == "GCU300" ]]; then set_add REQ_TARGETS "gcu300";
    elif [[ "${tgt}" == "GCU210" ]]; then set_add REQ_TARGETS "gcu210";
    elif [[ "${tgt}" == "GCUSIM4" ]]; then set_add REQ_TARGETS "sim-gcu400";
    elif [[ "${tgt}" == "GCUSIM5" ]]; then set_add REQ_TARGETS "sim-gcu500";
    elif [[ "${tgt}" == "GCUSIM" ]]; then set_add REQ_TARGETS "sim-gcu400" "sim-gcu500";
    fi
  done
}

gcu_detect() {
  local _gcu_dstr="$(lspci 2>/dev/null | grep -E '(Enflame|Tencent)' | head -1)"
  gcu_device_count=$(lspci 2>/dev/null | grep -cE '(Enflame|Tencent)')
  case "${_gcu_dstr}" in
    *S60G*)
      gcu_arch=gcu300
      ;;
    *c035*|*S60*)
      gcu_arch=gcu300
      ;;
    *I20*)
      gcu_arch=gcu210
      ;;
    *Tencent*)
      gcu_arch=gcu210
      ;;
    *)
      gcu_arch="none"
      ;;
  esac
  if [ "$gcu_arch" != "none" ]; then
    device_type="gcu"
    mach=${gcu_arch}
  fi
}

gcu_noskip() {
  if ! set_empty REQ_TARGETS && (( gcu_min_devices > 0 && gcu_device_count < gcu_min_devices )); then
    echo "SKIP(need ${gcu_min_devices} devices, have ${gcu_device_count}): ${file} "
    num_skiped=$(($num_skiped + 1));
    return 1;
  fi
  return 0;
}

gcu_command() {
  declare -n cmd_ref="$1"
  # Pick the right arch for this test: if its REQUIRES targets
  # include a simulator prefix and one is available, use it.
  # Also match the base arch (e.g. gcu400 covers sim-gcu400).
  local _cmd_arch="${choreo_arch}"
  if [[ -n "$simulator" && "$simulator" != "none" ]]; then
    _sim_base="${simulator#sim-}"
    if set_contains_prefix REQ_TARGETS "sim-" || set_contains REQ_TARGETS "$_sim_base"; then
      _cmd_arch="${simulator}"
    fi
  fi
  cmd_ref=${cmd_ref//%gcu_arch/"-arch=${_cmd_arch:-native}"}
  cmd_ref="${cmd_ref//%target/-t topscc}"
}

gcu_set_choreo_target() {
  choreo_target="topscc"
  if [ "$gcu_arch" != "none" ]; then
    choreo_arch="${gcu_arch}"
  fi
}

register_hook "all_archs" "add_all_gcu_archs"
register_hook "set_archs" "add_gcu_arch"
register_hook "hw_detect" "gcu_detect"
register_hook "target_noskip" "gcu_noskip"
register_hook "target_cmd" "gcu_command"
register_hook "target_prepare" "gcu_set_choreo_target"
