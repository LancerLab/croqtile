# co-lit
# Mock lit.cfg for lit.sh self-tests.
# Provides a fake hardware machine (mock) so we can exercise --sim=off/on/only,
# --run-only, and --target-only filtering without real hardware.  No simulator
# is emulated: every mock file is hardware-runnable, so --sim=only skips and
# --sim=off/on run via the file-level gating.

add_all_archs() {
  set_add ALL_ARCHS "mock"
}

add_arch() {
  local tgts=("$@")
  for tgt in "${tgts[@]}"; do
    if [[ "${tgt}" == "MOCK" ]]; then
      set_add REQ_TARGETS "mock"
    fi
  done
}

mock_detect() {
  device_type="mock"
  mach="mock"
}

mock_cmd() {
  declare -n cmd_ref="$1"
  cmd_ref="${cmd_ref//%mock_arch/"-arch=mock"}"
  # lit-self tests validate filtering flags; they are meant to run via
  # run_tests.sh with --dry-run.  When lit.sh discovers them directly
  # (e.g. `lit.sh -l tests`), wrap in echo to avoid real compilation
  # with fake targets (mock, app1, app2, etc.).
  cmd_ref="echo '[lit-self]' $cmd_ref"
}

register_hook "all_archs" "add_all_archs"
register_hook "set_archs" "add_arch"
register_hook "hw_detect" "mock_detect"
register_hook "target_cmd" "mock_cmd"
