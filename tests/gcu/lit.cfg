# co-lit
gcu_arch="none"
gcu_sim_lib=
gcu_sim_arch=
is_dynshape_supported=0

add_all_gcu_archs() {
	set_add REQ_TARGETS "gcu210" "gcu300" "gcu400"
}

add_gcu_arch() {
  local tgts="$@"
  for tgt in ${tgts}; do
    if [[ "${tgt}" == "GCU500" ]]; then set_add REQ_TARGETS "gcu500";
    elif [[ "${tgt}" == "GCU400" ]]; then set_add REQ_TARGETS "gcu400";
    elif [[ "${tgt}" == "GCU300" ]]; then set_add REQ_TARGETS "gcu300";
    elif [[ "${tgt}" == "GCU210" ]]; then set_add REQ_TARGETS "gcu210";
    elif [[ "${tgt}" == "GCUSIM4" ]]; then set_add REQ_TARGETS "sim-gcu400";
    elif [[ "${tgt}" == "GCUSIM5" ]]; then set_add REQ_TARGETS "sim-gcu500";
    elif [[ "${tgt}" == "GCUALL" ]]; then
      set_add REQ_TARGETS "gcu210" "gcu300" "gcu400"
    fi
  done
}

gcu_detect() {
  local _gcu_dstr="$(lspci | grep -E '(Enflame|Tencent)' | head -1)"
  case "${_gcu_dstr}" in
    *S60G*)
      gcu_arch=gcu300
      ;;
    *c035*|*S60*)
      gcu_arch=gcu300
      is_dynshape_supported=1
      ;;
    *I20*)
      gcu_arch=gcu210
      ;;
    *Tencent*)
      gcu_arch=gcu210
      ;;
    "")
      ;;
  esac
  if [ "$gcu_arch" != "none"  ]; then
    device_type="gcu"
    mach=${gcu_arch}
  fi
}

detect_simulator_features() {
  if [ -f "${script_dir}/../extern/lib/libgcusim.so" ]; then
    # the simulators exist
    gcu_sim_lib=${script_dir}/../extern/lib/
    gcu_sim_arch=sim-gcu400
    simulator=${gcu_sim_arch}
  elif [ -f "${script_dir}/../extern/lib/libgcusim5.so" ]; then
    gcu_sim_lib=${script_dir}/../extern/lib/
    gcu_sim_arch=sim-gcu500
    simulator=${gcu_sim_arch}
  fi
}

gcu_noskip() {
  if [ $requires_dynamic_shape -eq 1 ]; then
    if [ $is_dynshape_supported -eq 0 ]; then
      echo "SKIP(dyn-shape): ${file} "
      num_skiped=$(($num_skiped + 1));
      return 1;
    fi
  fi

  # requires simulator
  if set_contains REQ_TARGETS "sim-gcu400" || set_contains REQ_TARGETS "sim-gcu500"; then
    if ! set_contains REQ_TARGETS "$simulator"; then
      echo "SKIP(SIM): ${file} (1 of 1)"
        num_skiped=$(($num_skiped + 1));
      return 1;
    else
      exe_env="old_path=${LD_LIBRARY_PATH}; export LD_LIBRARY_PATH=${gcu_sim_lib}:${LD_LIBRARY_PATH};"
      unset_env="export LD_LIBRARY_PATH=${old_path}; unset INTERNAL_GCU_SIM;"
      if [[ "$simulator" == "sim-gcu400" ]]; then
        exe_env="${exe_env} export INTERNAL_GCU_SIM=LIBRA;"
        elif [[ "$simulator" == "sim-gcu500" ]]; then
          exe_env="${exe_env} export INTERNAL_GCU_SIM=DRACO;"
      fi
    fi
  fi
  return 0;
}

gcu_command() {
  declare -n cmd_ref="$1"
  cmd_ref=${cmd_ref//%gcu_arch/"-arch=${gcu_arch}"}
  cmd_ref="${cmd_ref//%target/-t topscc}"
}

gcu_set_choreo_target() {
  choreo_target="topscc"
  if [ "$gcu_arch" != "none" ]; then
    choreo_arch="${gcu_arch}"
  fi
}

register_hook "all_archs" "add_all_gcu_archs"
register_hook "set_archs" "add_gcu_arch"
register_hook "hw_detect" "gcu_detect"
register_hook "hw_detect" "detect_simulator_features"
register_hook "target_noskip" "gcu_noskip"
register_hook "target_cmd" "gcu_command"
register_hook "target_prepare" "gcu_set_choreo_target"

# Tests in ../check run under GCU hooks when the full suite is invoked.
include_dir "../check"

